---
argument_specs:
  main:
    short_description: Deploy email-exporter and its systemd timer
    options:
      config:
        type: dict
        required: true
        description: Non-secret settings, from the caller's inventory.
        mutually_exclusive: [[bucket_name, root]]
        required_one_of: [[bucket_name, root]]
        options:
          bucket_name:
            type: str
            description: >-
              Bucket the exporter writes messages and sync state to, handed to
              main.py as BUCKET_NAME. The app has no default for it.
          root:
            type: str
            description: >-
              Existing directory to write to instead of a bucket, handed to
              main.py as STORAGE_ROOT. The service requires the mount that
              holds it, and needs no AWS credentials.
          groups:
            type: list
            elements: str
            description: >-
              Extra groups for the service user, such as the group a mounted
              root grants write access to.
          timer:
            type: bool
            default: true
            description: >-
              Whether the timer is enabled and started. False where something
              else starts email-exporter.service. Applied by the role itself,
              like version.
          owner:
            type: str
            required: true
            description: >-
              Human user who owns the checkout and may edit it. The service
              runs as its own system user and only ever reads.
          version:
            type: str
            default: main
            description: >-
              Branch, tag or commit to check out. Suboption defaults are
              documentation only, so the role applies this one itself.

      secrets:
        type: dict
        required: true
        no_log: true
        description: Everything that must not be logged.
        options:
          users:
            type: list
            elements: str
            required: true
            description: >-
              One complete account TOML document per mailbox owner. The
              filename is taken from the imap.username inside it.
          aws:
            type: dict
            description: >-
              AWS credentials for the bucket the exporter writes to. Required
              with config.bucket_name.
            options:
              credentials:
                type: dict
                required: true
                description: Access key pair for the exporter's IAM user.
                options:
                  access_key:
                    type: str
                    required: true
                    description: AWS_ACCESS_KEY_ID.
                  secret_key:
                    type: str
                    required: true
                    description: AWS_SECRET_ACCESS_KEY.
